<!DOCTYPE html>
<html lang="en">
<head>
    <title>Calculator UI</title>
    <link rel="stylesheet"href="style9.css">
</head>
<body>
    <div class="calculator">
  <div class="output">
    <span class="result"></span>
  </div>
  <div class="buttons">
    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button>+</button>
    <button>4</button>
    <button>5</button>
    <button>6</button>
    <button>-</button>
    <button>7</button>
    <button>8</button>
    <button>9</button>
    <button>*</button>
    <button class="bg-red">C</button>
    <button>0</button>
    <button class="bg-green">=</button>
    <button>/</button>
  </div>
</div>

</body>
</html>
